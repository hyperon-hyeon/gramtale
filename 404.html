<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#F3F0E8" />
  <title>그램테일</title>
  <link rel="icon" href="/icon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/icon.png" />
  <link rel="preload" href="/icon.png" as="image" />
  <style>
    .splash{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:#f3f0e8;color:#17212f;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif}
    .splash__inner{display:grid;justify-items:center;text-align:center}
    .splash__logo{width:82px;height:82px;border-radius:22px;box-shadow:0 18px 44px rgba(23,33,47,.16);animation:splash-float 1.6s ease-in-out infinite}
    .splash__name{margin-top:20px;font-size:1.25rem;font-weight:750;letter-spacing:-.04em}
    .splash__copy{margin-top:7px;color:#8a918f;font-size:.82rem}
    .splash__bar{width:112px;height:3px;margin-top:24px;overflow:hidden;border-radius:99px;background:rgba(23,33,47,.1)}
    .splash__bar::after{content:"";display:block;width:46%;height:100%;border-radius:inherit;background:#413b8f;animation:splash-load 1.15s ease-in-out infinite}
    .splash.is-error .splash__logo,.splash.is-error .splash__bar::after{animation:none}
    .splash.is-error .splash__bar{display:none}
    @keyframes splash-float{50%{transform:translateY(-6px)}}
    @keyframes splash-load{from{transform:translateX(-110%)}to{transform:translateX(240%)}}
    @media(prefers-reduced-motion:reduce){.splash__logo,.splash__bar::after{animation:none}}
  </style>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="app">
    <div class="splash" role="status" aria-live="polite">
      <div class="splash__inner">
        <img class="splash__logo" src="/icon.png" alt="" />
        <strong class="splash__name">그램테일</strong>
        <span class="splash__copy">이야기를 펼치는 중</span>
        <span class="splash__bar" aria-hidden="true"></span>
      </div>
    </div>
  </div>
  <script>
    window.setTimeout(function () {
      var splash = document.querySelector(".splash");
      if (!splash) return;
      splash.classList.add("is-error");
      var copy = splash.querySelector(".splash__copy");
      if (copy) copy.textContent = "불러오지 못했어요. 페이지를 새로고침해 주세요.";
    }, 8000);
  </script>
  <script defer src="/js/meta.js"></script>
  <script defer src="/js/stories-be.js"></script>
  <script defer src="/js/stories-present.js"></script>
  <script defer src="/js/stories-past.js"></script>
  <script defer src="/js/stories-compare.js"></script>
  <script defer src="/js/stories-compare-more.js"></script>
  <script defer src="/js/stories-compare-final.js"></script>
  <script defer src="/js/stories-modal.js"></script>
  <script defer src="/js/mix.js"></script>
  <script defer src="/js/app.js"></script>
</body>
</html>
